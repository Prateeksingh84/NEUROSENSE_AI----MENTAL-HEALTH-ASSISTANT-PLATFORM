<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signing in...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#f4f7f2;color:#1a2e18;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.card{
  width:min(420px,92vw);padding:2.5rem 2rem;border-radius:24px;
  background:#fff;border:1.5px solid #d3e6cc;
  box-shadow:0 20px 60px rgba(45,122,58,.12);text-align:center;
}
.logo-icon{
  width:60px;height:60px;border-radius:18px;margin:0 auto 1.2rem;
  display:grid;place-items:center;font-size:1.8rem;
  background:linear-gradient(135deg,#2d7a3a,#3fa050);
  box-shadow:0 8px 22px rgba(45,122,58,.25);
}
.spinner{
  width:44px;height:44px;border-radius:50%;
  border:4px solid #c3e6b8;border-top-color:#2d7a3a;
  margin:0 auto 1rem;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
h2{font-family:'Outfit',sans-serif;font-size:1.4rem;font-weight:800;margin-bottom:.5rem;color:#1a2e18}
p{color:#7a9e74;font-size:.9rem;line-height:1.6}
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/neurosense-brand-logo.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/neurosense-ui-image.css') }}">
</head>
<body>
<div class="card">
  <div class="logo-icon">🧠</div>
  <div class="spinner"></div>
  <h2>Signing you in...</h2>
  <p>Please wait while NeuroSense AI verifies your Supabase session.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient("{{ supabase_url }}","{{ supabase_anon_key }}");
async function syncSession(){
  try{
    const{data,error}=await supabaseClient.auth.getSession();
    if(error||!data.session){alert(error?.message||"Login failed. No Supabase session found.");window.location.href="/auth";return}
    const res=await fetch("/api/auth/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({access_token:data.session.access_token})});
    const out=await res.json();
    if(out.ok){window.location.href=out.redirect||"/mode"}else{alert(out.error||"Session sync failed");window.location.href="/auth"}
  }catch(err){alert(err.message||"Authentication failed");window.location.href="/auth"}
}
syncSession();
</script>
</body>
</html>
