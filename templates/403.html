<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Access Denied • NeuroSense AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f2;--card:#ffffff;--green:#2d7a3a;--green2:#3fa050;--mint:#e8f5e3;--border:#c3e6b8;--text:#1a2e18;--muted:#4a6645;--danger:#d94040;}
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;display:grid;place-items:center;padding:2rem;font-family:Inter,sans-serif;background:radial-gradient(circle at top left,rgba(63,160,80,.12),transparent 35%),var(--bg);color:var(--text);}
.card{width:min(620px,100%);background:var(--card);border:1.5px solid var(--border);border-radius:28px;padding:2rem;box-shadow:0 24px 70px rgba(45,122,58,.14);text-align:center;}
.icon{width:78px;height:78px;margin:0 auto 1rem;display:grid;place-items:center;border-radius:24px;background:#fdecec;color:var(--danger);font-size:2.1rem;}
h1{font-family:Outfit,sans-serif;font-size:2rem;font-weight:900;color:var(--text);}p{margin-top:.8rem;color:var(--muted);line-height:1.7;}.email{margin-top:.9rem;padding:.8rem 1rem;border-radius:16px;background:var(--mint);border:1.5px solid var(--border);color:var(--green);font-weight:800;word-break:break-word;}.actions{margin-top:1.4rem;display:flex;justify-content:center;gap:.8rem;flex-wrap:wrap;}.btn{min-height:44px;padding:0 1.1rem;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;text-decoration:none;}.primary{background:linear-gradient(135deg,var(--green),var(--green2));color:white;}.secondary{background:var(--mint);color:var(--green);border:1.5px solid var(--border);}
</style>
</head>
<body>
<div class="card">
    <div class="icon">🔒</div>
    <h1>Access Denied</h1>
    <p>{{ message or "You do not have permission to access this admin area." }}</p>
    <div class="email">Logged in as: {{ email or "Unknown user" }}</div>
    <div class="actions">
        <a href="/dashboard" class="btn primary">Go to Dashboard</a>
        <a href="/logout" class="btn secondary">Logout</a>
    </div>
</div>
</body>
</html>
